name: Importar lugares de OpenStreetMap
on:
  workflow_dispatch:
  push:
    paths: ['scripts/importar-osm.mjs']
  schedule:
    - cron: '17 4 1 * *'   # día 1 de cada mes
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/importar-osm.mjs
      - name: Guardar cambios
        run: |
          git config user.name "importador-osm"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/osm-lugares.json
          git diff --cached --quiet || git commit -m "Actualiza lugares de OpenStreetMap"
          git push
